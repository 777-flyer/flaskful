[project]
name = "flaskful"
version = "1.0.0"
description = "FlaskFul — Scalable, enterprise-secure RESTful API boilerplate for Flask"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"
