services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flaskful-api
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      TRUSTED_PROXY_COUNT: "1"
      SECRET_KEY: ${SECRET_KEY:-prod-replace-this-with-64-char-random-secret-key-0123456789abcdef}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-prod-replace-this-with-64-char-random-jwt-secret-key-fedcba987654}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flaskful}:${POSTGRES_PASSWORD:-flaskful_secret_pw}@db:5432/${POSTGRES_DB:-flaskful_db}
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "5000"
    networks:
      - backend

  db:
    image: postgres:16-alpine
    container_name: flaskful-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flaskful}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flaskful_secret_pw}
      POSTGRES_DB: ${POSTGRES_DB:-flaskful_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flaskful} -d ${POSTGRES_DB:-flaskful_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: flaskful-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: flaskful-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge

