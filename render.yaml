services:
  - type: web
    name: flaskful-api
    runtime: python
    buildCommand: pip install -r requirements.txt psycopg[binary]>=3.2.0
    preDeployCommand: flask init-db
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /api/v1/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-frontend-domain.com
      - key: DATABASE_URL
        fromDatabase:
          name: flaskful-db
          property: connectionString

databases:
  - name: flaskful-db
    DatabaseName: flaskful
    user: flaskful
    plan: free

