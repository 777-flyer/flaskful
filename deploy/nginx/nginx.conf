# Edge rate limiting zone (10 requests/sec per IP with burst capacity)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream flaskful_backend {
    server api:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Hide Nginx version in headers and error pages
    server_tokens off;

    # Match Flask MAX_CONTENT_LENGTH (1 MB) to drop oversized payloads at the edge
    client_max_body_size 1M;

    # Timeouts
     proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://flaskful_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Forward client IP, protocol, and correlation request ID
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
